name: Validate Specification

on:
  push:
  pull_request:

jobs:
  spec-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Validate specification snapshot
        run: python tools/check_spec_version.py
      - name: Require development snapshot or exact release tag
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: python tools/check_spec_version.py --require-unreleased-unless-tagged
      - name: Require release tag to match SPEC_VERSION
        if: startsWith(github.ref, 'refs/tags/')
        run: python tools/check_spec_version.py --expected-version "$GITHUB_REF_NAME"
  reference-vectors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install reference validator dependencies
        run: python -m pip install --disable-pip-version-check -r tools/requirements-ci.txt
      - name: Validate independent vector suites
        run: python tools/validate_vectors.py --suite all
