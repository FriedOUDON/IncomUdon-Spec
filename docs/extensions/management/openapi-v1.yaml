openapi: 3.1.0
info:
  title: IncomUdon Management Plane API
  version: v1-draft
  description: |
    Optional administration-plane API. It uses HTTPS with required mutual TLS.
    It never returns channel credentials, media keys, media plaintext, or client
    certificate private keys.
servers:
  - url: https://management.example.invalid/v1
security:
  - mutualTLS: []
paths:
  /health:
    get:
      operationId: getHealth
      summary: Read Management Service health.
      description: Requires the explicit global health.read permission; channel-scoped roles do not imply it.
      responses:
        '200':
          description: Health snapshot.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    enum: [healthy, degraded, unhealthy]
                additionalProperties: false
        '403': { $ref: '#/components/responses/Forbidden' }
  /channels:
    get:
      operationId: listChannels
      summary: List channels visible to the authenticated service.
      description: Returns only channels for which the caller has viewer scope.
      responses:
        '200':
          description: Channel summaries.
          content:
            application/json:
              schema:
                type: object
                required: [channels]
                properties:
                  channels:
                    type: array
                    items:
                      $ref: '#/components/schemas/ChannelSummary'
                additionalProperties: false
        '403': { $ref: '#/components/responses/Forbidden' }
  /channels/{channel_id}/participants:
    get:
      operationId: listParticipants
      summary: Read current participant state for one authorized channel.
      parameters:
        - $ref: '#/components/parameters/ChannelId'
      responses:
        '200':
          description: Participant snapshot.
          content:
            application/json:
              schema:
                type: object
                required: [channel_id, participants]
                properties:
                  channel_id: { $ref: '#/components/schemas/U32' }
                  participants:
                    type: array
                    items: { $ref: '#/components/schemas/Participant' }
                additionalProperties: false
        '403': { $ref: '#/components/responses/Forbidden' }
  /audit-records:
    get:
      operationId: listAuditRecords
      summary: List retained redacted audit records visible to the authenticated service.
      description: |
        This is a paginated, read-only audit-retrieval resource. It is distinct
        from the SSE /events stream. The caller requires the auditor operation for
        each returned channel, or an explicitly configured global audit permission
        for records whose channel_id is null.
      parameters:
        - name: channel_id
          in: query
          required: false
          schema: { $ref: '#/components/schemas/U32' }
        - name: since
          in: query
          required: false
          description: Inclusive RFC 3339 UTC lower timestamp bound.
          schema: { type: string, format: date-time }
        - name: until
          in: query
          required: false
          description: Exclusive RFC 3339 UTC upper timestamp bound.
          schema: { type: string, format: date-time }
        - name: action
          in: query
          required: false
          schema: { type: string, pattern: '^[a-z][a-z0-9_]{0,63}$' }
        - name: result
          in: query
          required: false
          schema: { enum: [success, denied, failed] }
        - name: cursor
          in: query
          required: false
          description: Opaque continuation token bound to the authenticated service and filters.
          schema: { type: string, minLength: 1, maxLength: 512 }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 1000, default: 100 }
      responses:
        '200':
          description: Audit records ordered newest first with a stable record_id tie-breaker.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditRecordPage' }
        '400':
          description: Invalid time range, filter, or cursor/filter combination.
        '403': { $ref: '#/components/responses/Forbidden' }
        '410':
          description: Requested audit cursor is no longer retained; start a new query.
  /events:
    get:
      operationId: streamEvents
      summary: Subscribe to redacted management events using SSE.
      description: Delivers only events whose channel scope authorizes the caller.
      parameters:
        - name: since
          in: query
          required: false
          description: Optional exclusive initial-replay cursor; ignored when Last-Event-ID is present.
          schema: { type: string, minLength: 1, maxLength: 64, pattern: '^[0-9]+$' }
        - name: Last-Event-ID
          in: header
          required: false
          description: Authoritative exclusive SSE reconnection cursor; takes precedence over since.
          schema: { type: string, minLength: 1, maxLength: 64, pattern: '^[0-9]+$' }
      responses:
        '200':
          description: Event stream. Each event's SSE id equals its event_id; selected cursors resume after that event.
          content:
            text/event-stream:
              schema:
                type: string
        '400':
          description: Selected since or Last-Event-ID cursor is malformed.
        '403': { $ref: '#/components/responses/Forbidden' }
        '410':
          description: Selected event cursor is unknown, belongs to another Management Service instance, or is no longer retained; fetch a fresh snapshot.
  /service-admission-grants:
    post:
      operationId: issueServiceAdmissionGrant
      summary: Issue a short-lived channel-scoped service admission grant.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [channel_id, sender_id, role, service_public_key]
              properties:
                channel_id: { $ref: '#/components/schemas/U32' }
                sender_id: { $ref: '#/components/schemas/U32' }
                role:
                  enum: [recorder, observer, automation]
                request_talk:
                  type: boolean
                  default: false
                request_interrupt:
                  type: boolean
                  default: false
                  description: Requests the ACL-derived interrupt permission; callers cannot select priority.
                service_public_key:
                  type: string
                  description: Base64url raw 32-byte Ed25519 public key.
                  pattern: '^[A-Za-z0-9_-]{43}$'
              additionalProperties: false
      responses:
        '201':
          description: Signed compact JWS grant. It is secret-adjacent and MUST NOT be logged.
          headers:
            Cache-Control:
              required: true
              schema: { const: no-store }
          content:
            application/json:
              schema:
                type: object
                required: [grant, expires_at]
                properties:
                  grant: { type: string, minLength: 1, maxLength: 768 }
                  expires_at: { type: string, format: date-time }
                additionalProperties: false
        '403': { $ref: '#/components/responses/Forbidden' }
  /recording-jobs:
    post:
      operationId: startRecordingJob
      summary: Create a recording job for one authorized channel.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [channel_id]
              properties:
                channel_id: { $ref: '#/components/schemas/U32' }
              additionalProperties: false
      responses:
        '201':
          description: Recording job accepted.
          content:
            application/json:
              schema:
                type: object
                required: [job_id, state]
                properties:
                  job_id: { type: string, minLength: 1, maxLength: 128 }
                  state: { enum: [starting, recording] }
                additionalProperties: false
        '403': { $ref: '#/components/responses/Forbidden' }
  /recording-jobs/{job_id}/stop:
    post:
      operationId: stopRecordingJob
      summary: Request a recording job stop.
      description: The server resolves the job's authoritative channel scope before authorization.
      parameters:
        - name: job_id
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
      responses:
        '202':
          description: Stop accepted.
        '403': { $ref: '#/components/responses/Forbidden' }
components:
  securitySchemes:
    mutualTLS:
      type: mutualTLS
      description: A trusted client certificate mapped to a Management Plane ACL is required.
  parameters:
    ChannelId:
      name: channel_id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/U32' }
  responses:
    Forbidden:
      description: The mTLS identity lacks the required Management Plane permission.
  schemas:
    U32:
      type: integer
      minimum: 0
      maximum: 4294967295
    Priority:
      type: integer
      minimum: 0
      maximum: 255
    ChannelSummary:
      type: object
      required: [channel_id, participant_count]
      properties:
        channel_id: { $ref: '#/components/schemas/U32' }
        participant_count: { type: integer, minimum: 0 }
      additionalProperties: false
    Participant:
      type: object
      required: [sender_id, state]
      properties:
        sender_id: { $ref: '#/components/schemas/U32' }
        state: { enum: [joined, talking, idle] }
      additionalProperties: false
    AuditRecord:
      type: object
      required: [record_id, timestamp, actor_type, actor_id, channel_id, action, result]
      properties:
        record_id: { type: string, minLength: 1, maxLength: 128 }
        timestamp: { type: string, format: date-time }
        actor_type: { enum: [identity, service, relay] }
        actor_id: { type: string, minLength: 1, maxLength: 128 }
        channel_id:
          oneOf:
            - { $ref: '#/components/schemas/U32' }
            - { type: 'null' }
        action: { type: string, pattern: '^[a-z][a-z0-9_]{0,63}$' }
        result: { enum: [success, denied, failed] }
        floor_interrupt: { $ref: '#/components/schemas/FloorInterruptAuditDetails' }
      additionalProperties: false
      allOf:
        - if:
            properties:
              action: { const: floor_interrupt }
            required: [action]
          then:
            required: [floor_interrupt]
            properties:
              actor_type: { enum: [identity, service] }
    FloorInterruptAuditDetails:
      type: object
      required: [requester_priority, replaced_sender_id, replaced_priority]
      properties:
        requester_priority: { $ref: '#/components/schemas/Priority' }
        replaced_sender_id:
          oneOf:
            - { $ref: '#/components/schemas/U32' }
            - { type: 'null' }
        replaced_priority:
          oneOf:
            - { $ref: '#/components/schemas/Priority' }
            - { type: 'null' }
      additionalProperties: false
      allOf:
        - if:
            properties:
              replaced_sender_id: { type: 'null' }
            required: [replaced_sender_id]
          then:
            properties:
              replaced_priority: { type: 'null' }
        - if:
            properties:
              replaced_sender_id: { $ref: '#/components/schemas/U32' }
            required: [replaced_sender_id]
          then:
            properties:
              replaced_priority: { $ref: '#/components/schemas/Priority' }
    AuditRecordPage:
      type: object
      required: [schema_version, records, next_cursor]
      properties:
        schema_version:
          type: string
          const: audit-retrieval-v1
        records:
          type: array
          items: { $ref: '#/components/schemas/AuditRecord' }
        next_cursor:
          oneOf:
            - { type: string, minLength: 1, maxLength: 512 }
            - { type: 'null' }
      additionalProperties: false
